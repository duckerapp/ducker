[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
coroutine = "1.10.1"
coreKtx = "1.19.0"
activity = "1.13.0"
appcompat = "1.8.0"
serialization = "1.7.3"
# The generator of the Binder glue (`:kaidl`, D-268) writes its output with KotlinPoet. Room's
# compiler shares the processor classpath and was built against this version; 2.4.0 breaks it
# (D-271). Raise it only together with Room, or after the checks in `kaidl/README.md`.
kotlinpoet = "2.0.0"
room = "2.8.5"
camerax = "1.6.2"
zxing-cpp = "3.1.1"
# Рисует QR подписки, чтобы поделиться ей (этап 10). zxing-cpp в Android только читает.
qrcodegen = "1.8.0"
androidx-activity-ktx = "1.13.0"
# ducker: интерфейс на Compose (D-3). BOM держит версии согласованными,
# поэтому у самих библиотек версии не указываются.
composeBom = "2026.09.00"
activityCompose = "1.13.0"
# Загрузка и кэш картинок по ссылке (иконки групп из профиля, D-45)
coil = "2.7.0"
sora = "0.24.6"
snakeyaml = "2.3"
# Только для проверок на JVM, в APK не попадает
junit = "4.13.2"
# ducker: baseline profile (этап 8.1). Плагин генерации, макробенчмарк и установщик
# профиля в APK; первые два в приложение не попадают.
benchmark = "1.5.0"
profileinstaller = "1.4.1"
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.7.0"
uiautomator = "2.3.0"

[libraries]
build-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
build-kotlin-common = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
build-kotlin-serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
build-ksp = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
build-kotlin-compose = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
build-baselineprofile = { module = "androidx.benchmark:benchmark-baseline-profile-gradle-plugin", version.ref = "benchmark" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
# Проверки на JVM: берём вариант, привязанный к JUnit, явно. Без плагина Kotlin
# (с AGP 9 он не нужен) обычный `kotlin("test")` разрешается в базовый артефакт
# без привязки к движку, и `kotlin.test.Test` не находится.
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlin-coroutine = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutine" }
kotlin-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
zxing-cpp = { module = "io.github.zxing-cpp:android", version.ref = "zxing-cpp" }
qrcodegen = { module = "io.nayuki:qrcodegen", version.ref = "qrcodegen" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidx-activity-ktx" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
coil-svg = { module = "io.coil-kt:coil-svg", version.ref = "coil" }
sora-editor = { module = "io.github.rosemoe:editor", version.ref = "sora" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
