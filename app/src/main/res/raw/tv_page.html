:root { --bg: #f2f2f2; --ink: #0a0a0a; --slab: #0a0a0a; --on-slab: #f2f2f2; --muted: #a8a8a8; --line: rgba(242, 242, 242, .28); --bad: #f2b8b5; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0a0a0a; --ink: #f2f2f2; --slab: #f2f2f2; --on-slab: #0a0a0a; --muted: #555; --line: rgba(10, 10, 10, .24); --bad: #b3261e; }
}
* { box-sizing: border-box; }
body { margin: 0; padding: 28px 16px 40px; background: var(--bg); color: var(--ink); font: 17px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
main { max-width: 30rem; margin: 0 auto; }
.mark { display: block; width: 100%; height: auto; margin-bottom: 64px; color: var(--ink); }
.slab { position: relative; padding: 28px 20px 24px; border-radius: 32px; background: var(--slab); color: var(--on-slab); }
.duck { position: absolute; right: 14%; bottom: calc(100% - 1px); width: 68px; height: auto; color: var(--slab); }
h1 { margin: 0 0 8px; font-size: 26px; line-height: 1.2; letter-spacing: -.01em; }
p { margin: 0 0 22px; color: var(--muted); }
label { display: block; margin-bottom: 8px; font-weight: 600; }
textarea { display: block; width: 100%; min-height: 112px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 18px; background: transparent; color: var(--on-slab); font: 16px/1.4 ui-monospace, Menlo, monospace; word-break: break-all; resize: vertical; }
textarea::placeholder { color: var(--muted); }
textarea:focus { outline: 2px solid var(--on-slab); outline-offset: 1px; }
button { display: block; width: 100%; margin-top: 14px; padding: 16px; border: 0; border-radius: 999px; background: var(--on-slab); color: var(--slab); font: inherit; font-weight: 700; }
button:disabled, textarea:disabled { opacity: .45; }
#status { min-height: 1.45em; margin: 16px 0 0; color: var(--on-slab); }
#status.bad { color: var(--bad); }
</style>
</head>

<script>
// AES-256-GCM sealing as the TV's unseal() expects: nonce, then ciphertext with its 16-byte tag (D-163).
// Its own code because a page without https has no crypto.subtle; getRandomValues works without it.
var S = (function () {
  var s = new Uint8Array(256), p = 1, q = 1, x;
  function rot(b, n) { return ((b << n) | (b >> (8 - n))) & 0xff; }
  do {
    p = (p ^ (p << 1) ^ (p & 0x80 ? 0x1b : 0)) & 0xff;
    q = (q ^ (q << 1)) & 0xff; q = (q ^ (q << 2)) & 0xff; q = (q ^ (q << 4)) & 0xff;
    if (q & 0x80) q ^= 0x09;
    x = q ^ rot(q, 1) ^ rot(q, 2) ^ rot(q, 3) ^ rot(q, 4);
    s[p] = x ^ 0x63;
  } while (p !== 1);
  s[0] = 0x63;
  return s;
})();

function xtime(b) { return ((b << 1) ^ (b & 0x80 ? 0x1b : 0)) & 0xff; }

function expand(key) {
  var w = new Uint8Array(240), rcon = 1, i, j, t;
  w.set(key);
  for (i = 32; i < 240; i += 4) {
    t = [w[i - 4], w[i - 3], w[i - 2], w[i - 1]];
    if (i % 32 === 0) { t = [S[t[1]] ^ rcon, S[t[2]], S[t[3]], S[t[0]]]; rcon = xtime(rcon); }
    else if (i % 32 === 16) t = [S[t[0]], S[t[1]], S[t[2]], S[t[3]]];
    for (j = 0; j < 4; j++) w[i + j] = w[i - 32 + j] ^ t[j];
  }
  return w;
}

function encrypt(w, block) {
  var s = new Uint8Array(16), t = new Uint8Array(16), r, c, j, a0, a1, a2, a3;
  for (j = 0; j < 16; j++) s[j] = block[j] ^ w[j];
  for (r = 1; r <= 14; r++) {
    for (c = 0; c < 4; c++) for (j = 0; j < 4; j++) t[4 * c + j] = S[s[4 * ((c + j) % 4) + j]];
    if (r < 14) for (c = 0; c < 16; c += 4) {
      a0 = t[c]; a1 = t[c + 1]; a2 = t[c + 2]; a3 = t[c + 3];
      t[c] = xtime(a0) ^ xtime(a1) ^ a1 ^ a2 ^ a3;
      t[c + 1] = a0 ^ xtime(a1) ^ xtime(a2) ^ a2 ^ a3;
      t[c + 2] = a0 ^ a1 ^ xtime(a2) ^ xtime(a3) ^ a3;
      t[c + 3] = xtime(a0) ^ a0 ^ a1 ^ a2 ^ xtime(a3);
    }
    for (j = 0; j < 16; j++) s[j] = t[j] ^ w[16 * r + j];
  }
  return s;
}

function gmul(x, h) {
  var z = new Uint8Array(16), v = new Uint8Array(h), i, j, low;
  for (i = 0; i < 128; i++) {
    if (x[i >> 3] & (0x80 >> (i & 7))) for (j = 0; j < 16; j++) z[j] ^= v[j];
    low = v[15] & 1;
    for (j = 15; j > 0; j--) v[j] = (v[j] >> 1) | ((v[j - 1] & 1) << 7);
    v[0] >>= 1;
    if (low) v[0] ^= 0xe1;
  }
  return z;
}

function seal(key, nonce, plain) {
  var w = expand(key), h = encrypt(w, new Uint8Array(16)), counter = new Uint8Array(16), x = new Uint8Array(16);
  var out = new Uint8Array(12 + plain.length + 16), i, j, n, pad, tag, bits = plain.length * 8;
  counter.set(nonce); counter[15] = 1;
  var first = encrypt(w, counter);
  out.set(nonce);
  for (i = 0; i < plain.length; i += 16) {
    for (j = 15; j >= 12 && ++counter[j] === 256; j--) counter[j] = 0;
    pad = encrypt(w, counter);
    n = Math.min(16, plain.length - i);
    for (j = 0; j < n; j++) out[12 + i + j] = plain[i + j] ^ pad[j];
    for (j = 0; j < n; j++) x[j] ^= out[12 + i + j];
    x = gmul(x, h);
  }
  for (j = 0; j < 4; j++) x[15 - j] ^= (bits >>> (8 * j)) & 0xff;
  tag = gmul(x, h);
  for (j = 0; j < 16; j++) out[12 + plain.length + j] = tag[j] ^ first[j];
  return out;
}
</script>
<script>
(function () {
  var form = document.getElementById('form'), field = document.getElementById('link');
  var button = document.getElementById('send'), status = document.getElementById('status');
  var key = decode(location.hash.slice(1));

  function say(name, bad) {
    status.textContent = status.getAttribute('data-' + name);
    status.className = bad ? 'bad' : '';
  }

  // The key travels after "#" and never reaches the network: base64url, 32 bytes.
  function decode(text) {
    if (!/^[\w-]{43}$/.test(text)) return null;
    var raw = atob(text.replace(/-/g, '+').replace(/_/g, '/') + '='), bytes = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    return bytes.length === 32 ? bytes : null;
  }

  if (!key) {
    field.disabled = button.disabled = true;
    return say('no-key', true);
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    var link = field.value.trim();
    if (!/^(https?|ducker|clash|clashmeta):\/\/\S+$/i.test(link)) return say('not-link', true);

    button.disabled = true;
    say('sending');
    var body = seal(key, crypto.getRandomValues(new Uint8Array(12)), new TextEncoder().encode(link));
    fetch(location.pathname, { method: 'POST', body: body, cache: 'no-store' }).then(function (response) {
      if (response.ok) {
        field.disabled = true;
        return say('sent');
      }
      button.disabled = false;
      say('refused', true);
    }, function () {
      button.disabled = false;
      say('no-answer', true);
    });
  });
})();
</script>
