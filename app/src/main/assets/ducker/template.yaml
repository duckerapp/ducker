x-anchors:
  reserved_ips: &reserved_ips
    - 0.0.0.0/8
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 192.168.0.0/16
    - 198.51.100.0/24
    - 203.0.113.0/24
    - 224.0.0.0/3
    - ::/127
    - fc00::/7
    - fe80::/10
    - ff00::/8

  # --- 🇷🇺 Локальный Рунет (Напрямую) ---
  # Ходит МИМО туннеля. Поэтому здесь только российские резолверы:
  # китайский 223.5.5.5 отсюда убран — из РФ он всегда проигрывает гонку,
  # но запрос всё равно уходит, а если выиграет — вернёт китайский CDN.
  dns_ru: &dns_ru
    - 77.88.8.8
    - 77.88.8.1

  # --- 🇷🇺 Резолвер выхода МИМО туннеля: домены узлов и «Без VPN» ---
  # Для proxy-server-nameserver и direct-nameserver: dns_ru + system.
  #
  # system на Android = DNS текущей сети (роутер / оператор). FlClashX берёт
  # его из LinkProperties сети без VPN (NetworkObserveModule.kt) и отдаёт
  # ядру: Core.updateDns -> dns.UpdateSystemDNS (dns/patch_android.go).
  # Ядро опрашивает все записи параллельно (dns/util.go, batchExchange) и
  # берёт первый не-SERVFAIL. Выигрыш: в сети, где закрыт внешний UDP/53
  # (гостевой, корпоративный Wi-Fi), домен ноды всё равно резолвится.
  # Пока список пуст (до первого updateDns) или устарел после смены сети,
  # system мгновенно отдаёт ошибку и гонку не тормозит.
  #
  # В dns_ru system НЕ добавлен: тот якорь стоит в ключах nameserver-policy,
  # их поведение этой правкой не меняем.
  dns_direct: &dns_direct
    - system
    - 77.88.8.8
    - 77.88.8.1

  # --- 🌐 Проксируемый DNS (Для заблокированного трафика) ---
  # Тег #Основной профиль = запрос уходит ВНУТРЬ туннеля.
  # Снаружи оператор видит только соединение с нодой, поэтому
  # блокировки DoH и DoT в РФ на это не влияют вообще.
  #
  # ОДНА ЗАПИСЬ, И ИМЕННО tcp://. Почему:
  #
  # 1. udp:// ехал бы UDP-сессией через прокси. При only-tcp: true это
  #    ОТДЕЛЬНОЕ соединение к ноде мимо мультиплекса (sing-mux/singmux.go),
  #    а бюджет — не больше трёх коннектов, иначе ТСПУ выдаёт теневой бан
  #    на 120 секунд. При only-tcp: false коннект не добавится, но UDP всё
  #    равно едет поверх TCP-носителя (adapter/outbound/vless.go) — выигрыша нет.
  #    tcp:// едет обычным стримом внутри h2mux при любом значении.
  #
  # 2. Второй слой TLS (https://) внутри уже зашифрованного туннеля
  #    не даёт ничего, кроме лишнего хендшейка на каждое новое соединение.
  #
  # 3. Второй сервер не нужен: на ноде правило dns-hijack перехватывает
  #    и 53/tcp, и 53/udp, A-запросы уходят во ВНУТРЕННИЙ резолвер ноды
  #    с прогретым кэшем и тремя апстримами. То есть 1.1.1.1 здесь —
  #    просто адрес назначения, до него запрос не доезжает. Дублировать
  #    его вторым сервером значит удвоить стримы ради нуля.
  #    Ядро опрашивает ВСЕ серверы группы одновременно (dns/util.go,
  #    batchExchange), так что лишние записи стоят реальных денег.
  dns_proxy: &dns_proxy
    - tcp://1.1.1.1#Основной профиль

  pr_http: &pr_http
    type: http
    interval: 259200
    proxy: Основной профиль

  rp_classical: &rp_classical
    <<: *pr_http
    behavior: classical
    format: yaml

  rp_domain: &rp_domain
    <<: *pr_http
    behavior: domain
    format: mrs

  rp_ipcidr: &rp_ipcidr
    <<: *pr_http
    behavior: ipcidr
    format: mrs

  # --- Общие настройки авто-групп ---
  #  ТАЙМИНГИ ПОД МОБИЛЬНУЮ СЕТЬ РФ — почему именно такие.
  #
  #  interval — это ТОЛЬКО фоновое обновление. Реальный обрыв ловится
  #  не им, а счётчиком неудачных подключений: max-failed-times отказов
  #  подряд внутри окна timeout запускают внеочередную проверку
  #  немедленно (adapter/outboundgroup/groupbase.go:283-297).
  #  Поэтому частый interval не нужен — он только жжёт батарею,
  #  дёргая проверку через каждый узел группы.
  #
  #  timeout 7000 — мобильный RTT в РФ регулярно скачет до 2-3 секунд
  #  при слабом сигнале. При 5000 живой узел объявляется мёртвым
  #  и группа начинает прыгать, обрывая соединения.
  #
  #  lazy включён по умолчанию (parser.go:53) и здесь не пишется:
  #  пока группа не используется, проверки не идут вообще.
  #
  #  Меняешь тайминги ЗДЕСЬ — меняются в обеих группах сразу.
  hc_auto: &hc_auto
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    timeout: 7000
    max-failed-times: 3
    expected-status: 204
    hidden: true
    # Проверять узлы, пока ими никто не пользуется, незачем (D-85). Без этой строки
    # ядро дозванивалось до каждого узла раз в пять минут круглые сутки: на подписке
    # из двадцати одного узла это шесть тысяч рукопожатий в день — впустую разбуженный
    # модем, расход батареи и трафика, нагрузка на провайдера.
    #
    # `lazy` в mihomo значит «пропустить проверку, если за интервал к группе никто
    # не обращался» (adapter/provider/healthcheck.go:52). Пока трафик идёт, проверки
    # идут как раньше: каждое соединение через группу отмечает её использованной
    # (fallback.go -> findAliveProxy(true) -> Touch).
    lazy: true

  # Служебные псевдо-узлы не должны попадать в списки выбора.
  no_service: &no_service "(?i)Без VPN|DIRECTv4"

# Порта локального прокси (`mixed-port`) здесь нет намеренно (D-216): туннелю он не
# нужен, а по открытому 127.0.0.1:7890 другие приложения узнают клиент mihomo и,
# пущенные мимо VPN, адрес узла. Кому прокси нужен — допишет строку в редакторе.
tcp-concurrent: true
mode: rule
log-level: error
ipv6: true
unified-delay: true

# ЗАДАНО ЯВНО, ХОТЯ СОВПАДАЕТ С ДЕФОЛТОМ ЯДРА (config/config.go,
# DefaultRawConfig). Полагаться на дефолт нельзя: он молча меняет поведение,
# если однажды поменяется в ядре, — и здесь есть случай хуже, см. ниже.
allow-lan: false          # дефолт false. Если порт прокси допишут руками,
                          # значение true выставило бы его наружу в LAN.
etag-support: true        # дефолт true. Делает обновление rule-provider'ов
                          # условным (304) вместо полной перекачки раз в 3 дня.
geo-auto-update: false    # дефолт false. Правил GEOIP/GEOSITE у нас нет,
geo-update-interval: 24   # geoip.dat/geosite.dat качать незачем.

# enable-process УДАЛЁН: такого ключа в текущем mihomo нет (структура
# RawConfig, config/config.go), YAML-парсер молча его глотал. Актуальный —
# find-process-mode.
#
# ⚠️ ЗАДАН ЯВНО, И ЭТО НЕ ПЕРЕСТРАХОВКА, А ИСПРАВЛЕНИЕ.
# Дефолт ЯДРА действительно strict (component/process/find_process_mode.go,
# FindProcessStrict = iota). Но до конфига он не доходит: FlClashX держит своё
# значение — lib/models/clash_config.dart, @Default(FindProcessMode.always), —
# а lib/state.dart:syncNetworkSettingsFromProvider читает find-process-mode
# из профиля ТОЛЬКО ЕСЛИ КЛЮЧ ТАМ ЕСТЬ. Без этой строки остаётся always.
#
# Что стоит always: tunnel/tunnel.go:393 вызывает helper.FindProcess()
# БЕЗУСЛОВНО на каждом соединении, до матчинга правил. Один вызов — это
# JNI-апкол в JVM -> ConnectivityManager.getConnectionOwnerUid() (binder IPC)
# -> packageManager.getPackagesForUid() (ещё один binder IPC), и всё это
# под семафором на 4 разрешения, общим с protect()
# (core/lib_android.go: semaphore.NewWeighted(4)). На слабом CPU это
# сериализует установку новых соединений.
#
# strict делает резолв ленивым: только когда матчинг реально дошёл до
# PROCESS-правила, и не больше одного раза на соединение (attemptProcessLookup
# сбрасывается в false при первом вызове). Поэтому все PROCESS-правила
# в этом файле сведены в один блок и опущены максимально низко.
find-process-mode: strict

# Быстрее замечать мёртвый носитель мультиплекса после сна ПК.
# Дефолт (0) означает системный таймаут: на Linux это 7200 секунд простоя
# до первой пробы — то есть практически никогда. С 30/10 ядро объявляет
# пира мёртвым примерно за 2 минуты, и пул поднимает новый носитель.
#
# На Android НЕ РАБОТАЕТ: mihomo принудительно выключает там keepalive
# независимо от конфига (component/keepalive/tcp_keepalive.go:35-41,
# SetKeepAlive -> if runtime.GOOS == "android" { setDisableKeepAlive(true) }).
# Телефон лечится только HTTP/2 PING'ом из h2mux — ещё одна причина
# перевести мультиплекс на h2mux в шаблоне подписки.
keep-alive-idle: 30
keep-alive-interval: 10

# ==========================================================================
#  ВСТРОЕННЫЙ NTP — СТРАХОВКА REALITY ОТ КРИВЫХ ЧАСОВ УСТРОЙСТВА
# ==========================================================================
#  По умолчанию выключен (config/config.go, RawNTP{Enable: false}).
#  Включаем осознанно, потому что REALITY завязан на время НАПРЯМУЮ:
#
#    component/tls/reality.go:44   utls.Config{ Time: ntp.Now, ... }
#    component/tls/reality.go:71   binary.BigEndian.PutUint64(
#                                      hello.SessionId, uint64(ntp.Now().Unix()))
#    component/tls/reality.go:188  x509.VerifyOptions{ CurrentTime: ntp.Now() }
#
#  Метка времени зашивается ПРЯМО В ClientHello, и сервер отвергает хендшейк
#  за пределами допустимого расхождения. На дешёвых устройствах с плавающими
#  часами это выглядит как «подключился и сразу отвалился».
#
#  ntp.Now() = системное время + внутреннее смещение (ntp/time.go). Смещение
#  заполняет этот сервис. Системные часы НЕ трогаем (write-to-system: false):
#  на Android без root это всё равно невозможно.
#
#  Совместимо с правилом NETWORK,udp,REJECT ниже: при пустом dialer-proxy
#  сервис использует dialer.NewDialer() (ntp/ntp/service.go:ReCreateNTPService)
#  — прямой диал МИМО движка правил, а на Android поверх него ещё и
#  DefaultSocketHook -> protect(), то есть сокет выходит мимо TUN.
#
#  Имя сервера резолвит proxy-server-nameserver, а НЕ nameserver-policy:
#  диалер сервиса создан без своего резолвера, и тогда ядро берёт
#  ProxyServerHostResolver (component/dialer/dialer.go, parseAddr). Там
#  российский DNS, поэтому NTP работает с первой секунды, до подъёма туннеля.
#  Строка pool.ntp.org в nameserver-policy нужна системному клиенту времени.
ntp:
  enable: true
  # pool.ntp.org, а НЕ time.google.com: пул распределён по anycast и не
  # зависит от достижимости Google из РФ. Оба имени есть и в fake-ip-filter,
  # и в nameserver-policy, так что fake-IP системный клиент не получит.
  server: pool.ntp.org
  port: 123
  interval: 30
  write-to-system: false

profile:
  # ⚠️ FlClashX ПРИНУДИТЕЛЬНО ставит store-selected: false
  # (lib/state.dart: rawConfig["profile"]["store-selected"] = false) — выбор
  # группы он хранит сам, в selectedMap. Строку оставляем: в других
  # Android-клиентах и на десктопе значение осмысленно.
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  # ЗАДАНО ЯВНО, ХОТЯ СОВПАДАЕТ С ДЕФОЛТОМ (config/config.go:590-592).
  # Полагаться на дефолт нельзя: он молча меняет маршрутизацию, если однажды
  # поменяется в ядре.
  #
  # override-destination: true — после снифинга ядро подменяет назначение
  # на распознанный домен и обнуляет DstIP. Для нашей схемы это ПРАВИЛЬНО:
  # ноде уезжает домен, она резолвит его своим DoH и выбирает CDN рядом
  # с собой, а не тот, что подсказал бы российский резолвер.
  #
  # parse-pure-ip: true — сниффер работает и для соединений, у которых домена
  # нет вовсе (приложение пошло на голый IP). Именно это позволяет ловить
  # системный DoH Windows по SNI, когда он коннектится на 8.8.8.8:443.
  #
  # force-dns-mapping: true — сниффер работает и для доменов из
  # fake-ip-filter, получивших НАСТОЯЩИЙ IP (режим mapping). Соединения
  # через fake-ip сниффер не трогает вовсе: домен у них уже известен
  # (component/sniffer/dispatcher.go, shouldOverride).
  override-destination: true
  parse-pure-ip: true
  force-dns-mapping: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-dst-address:
    # Тот же набор, что в reserved_ips: YAML не умеет сливать список из якоря
    # с дополнением, поэтому перечислено заново.
    - 0.0.0.0/8
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 192.168.0.0/16
    - 198.51.100.0/24
    - 203.0.113.0/24
    - 224.0.0.0/3
    - ::/127
    - fc00::/7
    - fe80::/10
    - ff00::/8
    # У MTProto нет SNI, поэтому TLS-сниффер на 443 обречён ждать данные и
    # ошибаться на каждом соединении Телеграма, добавляя задержку к установке.
    # Замерено 17.09.2026: 167 неудач снифера на соединениях Телеграма плюс
    # таймаут чтения, при этом клиент перезванивает к тому же адресу каждые
    # ~6 секунд (FACTS.md, F-73).
    - rule-set:telegram_ips

