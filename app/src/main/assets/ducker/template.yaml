  default-nameserver:
    - 77.88.8.8
  nameserver: *dns_proxy
  proxy-server-nameserver: *dns_direct
  direct-nameserver: *dns_direct
  direct-nameserver-follow-policy: true
  nameserver-policy:
    "rule-set:geosite-private":
      - system
    "+.lan,+.local,+.home.arpa,+.routerlogin.net":
      - system
    "rule-set:youtube,category-ban-ru,whatsapp_domains,telegram_domains,discord_domains": *dns_proxy
    "rule-set:meta_domains,instagram,instagram_ads,twitter_domains,google-play": *dns_proxy
    "rule-set:geosite-ru,custom-direct,torrent-trackers,tiktok,ru-direct-inline": *dns_ru
    "+.fcm.googleapis.com,+.fcm-xmpp.googleapis.com,+.mtalk.google.com": *dns_ru
    "time.google.com,+.pool.ntp.org,time.android.com,time.apple.com": *dns_ru

proxy-groups:

  - name: Основной профиль
    type: select
    url: https://connectivitycheck.gstatic.com/generate_204
    expected-status: 204
    interval: 1800
    lazy: true
    exclude-filter: *no_service
    include-all: true
    exclude-type: "Direct|Reject|RejectDrop|Pass|Compatible"
    empty-fallback: REJECT
    proxies:
      - ⚡ AUTO

  - name: Без VPN
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png
    type: select
    url: https://connectivitycheck.gstatic.com/generate_204
    expected-status: 204
    interval: 300
    hidden: true
    proxies:
      - DIRECTv4

  - name: ⚡ AUTO
    <<: *hc_auto
    type: fallback
    url: https://connectivitycheck.gstatic.com/generate_204
    expected-status: 204
    include-all: true
    exclude-type: "Direct|Reject|RejectDrop|Pass|Compatible"
    empty-fallback: REJECT
    exclude-filter: *no_service

  - name: "Google Поиск"
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png
    type: select
    url: https://connectivitycheck.gstatic.com/generate_204
    expected-status: 204
    interval: 300
    proxies:
      - Основной профиль
      - Без VPN

