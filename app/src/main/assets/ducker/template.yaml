  enable: true
  # ==========================================================================
  #  ЧТО ИЗ ЭТОГО БЛОКА РЕАЛЬНО ДОХОДИТ ДО ЯДРА НА FlClashX
  # ==========================================================================
  #  FlClashX не отдаёт tun: в ядро целиком. core/tun/tun.go ПЕРЕСОБИРАЕТ
  #  LC.Tun с нуля и передаёт только: Stack, DNSHijack, EndpointIndependentNat,
  #  UDPTimeout, DisableICMPForwarding — плюс жёстко зашитый
  #  Inet4Address = 172.19.0.1/30. Всё остальное отсюда до sing-tun не доезжает.
  #
  #  Ключи ниже НЕ УДАЛЕНЫ намеренно: в ClashMetaForAndroid и других клиентах,
  #  отдающих tun: в ядро целиком, они работают. Здесь помечено, что есть что.
  # ==========================================================================
  #
  #  stack — ✅ РАБОТАЕТ. Профиль выигрывает у настройки приложения, пока
  #  appSetting.overrideNetworkSettings выключен (дефолт):
  #  lib/state.dart:syncNetworkSettingsFromProvider читает tun.stack из профиля.
  #  Ядро собрано с тегом with_gvisor (setup.dart:180 -> "with_gvisor,cmfa"),
  #  так что доступны все три: system / gvisor / mixed.
  #  system выбран за наименьший расход памяти — это важно на устройствах
  #  Android Go с 2-3 ГБ ОЗУ. Если на конкретном устройстве плохо именно с UDP,
  #  осмысленная альтернатива — mixed (system TCP + gvisor UDP).
  #
  #  С коммита ab405ba у ядра появился четвёртый стек — `mips` (D-86). На стенде
  #  он выигрывает у system на многопоточном TCP и на форвардинге, но проигрывает
  #  в один поток и по задержке, а на слабом железе разбухает по памяти. Замер
  #  на телефоне (100 МБ через туннель, три круга на стек) разницы не показал
  #  вовсе: на реальных 7–8 МБ/с оба стека простаивают. Поэтому умолчание прежнее,
  #  а выбрать `mips` можно в настройках приложения — там же, где остальные три.
  #
  #  Про `gso: true`, который на стенде удваивал скорость: это лекарство от MTU 1500.
  #  У нас MTU 9000 (TunService.TUN_MTU, проверено на устройстве: `tun0 mtu 9000`),
  #  и ядро само отдаёт в туннель крупные сегменты — включать нечего.
  stack: system
  #  ❌ auto-route / auto-detect-interface — на FlClashX no-op: маршруты ставит
  #  VpnService.Builder, а core/tun/tun.go эти поля не передаёт. Побочный
  #  плюс: sing-tun из-за этого не поднимает NetworkUpdateMonitor
  #  (listener/sing_tun/server.go:337), а значит не трогает netlink, который
  #  Google запретил приложениям с Android 14.
  auto-route: true
  auto-detect-interface: true
  #  ⚠️ dns-hijack — FlClashX ВСЕГДА перетирает этот ключ значением ["any:53"]
  #  (lib/state.dart: rawConfig["tun"]["dns-hijack"] = realPatchConfig.tun.dnsHijack).
  #  Потери нет: mihomo срезает схему (listener/sing_tun/server.go:280,
  #  strings.Cut(d, "://")) и превращает any -> 0.0.0.0, а ShouldHijackDns
  #  (listener/sing_tun/dns.go) матчит ЛЮБОЙ адрес на порту 53 и вызывается
  #  и из NewConnection (TCP), и из NewPacket/NewPacketConnection (UDP).
  #  То есть одна строка any:53 уже перехватывает и 53/tcp, и 53/udp.
  #  tcp://any:53 оставлен для sing-box-совместимых клиентов, где схема значима.
  dns-hijack:
    - any:53
    - tcp://any:53
  #  ❌ strict-route / route-exclude-address — на FlClashX no-op, не передаются.
  #  ВАЖНО НЕ ОБМАНУТЬСЯ: route-exclude-address НЕ выводит приватные сети
  #  из туннеля. NetworkProps.routeMode по умолчанию RouteMode.config ->
  #  routeAddress = [] -> builder.addRoute("0.0.0.0", 0). Весь IPv4 идёт в TUN.
  #  Локалку спасает первое маршрутное правило в rules: RULE-SET,geoip-private,
  #  Без VPN (выше него стоит только REJECT на порт 853).
  strict-route: true
  route-exclude-address: *reserved_ips
  #  ЧЕГО ЗДЕСЬ НАМЕРЕННО НЕТ — разобрано по коду sing-tun v0.4.22
  #  (версия из go.mod mihomo 1.19.30):
  #
  #  udp-timeout — ключ назван обманчиво. На stack: system он уходит в
  #    stack_system.go:174 -> s.tcpNat = NewNat(s.ctx, s.udpTimeout), то есть
  #    это таймаут ТАБЛИЦЫ ТРАНСЛЯЦИИ TCP (stack_system_nat.go: type TCPNat),
  #    а не UDP. UDP в system-стеке (processIPv4UDP) его не использует вообще;
  #    на gvisor поле кладётся в структуру и нигде не читается.
  #    Запись обновляется только LookupBack, то есть ВХОДЯЩИМИ пакетами;
  #    исходящий Lookup при попадании в кэш LastActive не трогает. А keepalive
  #    на Android ядро выключает безусловно. Значит короткое значение убило бы
  #    молчащие долгоживущие TCP-сокеты (push, WebSocket, long-poll).
  #    Дефолт 5 минут (listener/sing/sing.go:32) — правильный, не трогаем.
  #    Реальное время жизни UDP-сессии задаёт tunnel/tunnel.go:63
  #    (udpTimeout = 60s) и это IDLE-таймаут: сбрасывается на каждом пакете
  #    (tunnel/connection.go:163,177). Активный звонок или игра его не
  #    достигают никогда, и из YAML он не настраивается.
  #
  #  endpoint-independent-nat — мёртвая опция. В sing-tun v0.4.22
  #    EndpointIndependentNat встречается ровно один раз, в объявлении поля
  #    StackOptions (stack.go:30), и ни один стек его не читает. Full-cone NAT
  #    недоступен ни на одном стеке этой версии. Разрешённый нами UDP
  #    (рефлекторы Telegram, Discord voice) — потоки клиент->сервер, которым
  #    симметричного NAT достаточно.
  #
  #  disable-icmp-forwarding — оставлен дефолт false. ICMP НИКОГДА не идёт
  #    через прокси: listener/sing_tun/prepare.go либо возвращает nil (и тогда
  #    sing-tun сам отвечает синтетическим echo reply), либо открывает прямой
  #    ICMP-сокет с логом "[ICMP] ... using DIRECT". Коннектов к ноде не
  #    создаёт ни при каком значении. При true ЛЮБОЙ ping отвечал бы мгновенным
  #    успехом, включая ping по IP ноды от поддержки, — это ломает диагностику.
  #    СЛЕДСТВИЕ ДЛЯ ПОДДЕРЖКИ: ping НЕ является проверкой туннеля. По домену
  #    он всегда получает фальшивый ответ (домен резолвится в fake-IP, и
  #    skipPingForwardingByAddr -> resolver.IsFakeIP отсекает форвардинг),
  #    по голому IP уходит напрямую мимо туннеля. Проверять только HTTP-пробой.

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  cache-algorithm: arc
  # ЗАДАНО ЯВНО, ХОТЯ СОВПАДАЕТ С ДЕФОЛТОМ (config/config.go, RawDNS).
  use-hosts: true
  use-system-hosts: true
  # Гонки fallback у нас нет и не должно быть: разделение РФ/мир делают
  # nameserver-policy и правила, а не сравнение ответов. При пустом fallback
  # блок fallback-filter инертен, поэтому его здесь и нет.
  fallback: []
  # 127.0.0.1, а не 0.0.0.0: при TUN внешняя привязка не нужна,
  # а на публичном Wi-Fi открытый резолвер видно сканированием.
  listen: 127.0.0.1:1053
  prefer-h3: false
  fake-ip-range: 198.18.0.1/16
  # respect-rules НЕ включаем (config/config.go, parseDNS -> parseNameServer).
  # Флаг вешает #RULES только на записи БЕЗ #proxy в nameserver/fallback/
  # nameserver-policy; proxy-server- и direct-nameserver не трогает. nameserver
  # у нас уже tcp://…#Основной профиль. Остаётся dns_ru в policy: 77.88.8.x
  # лежит в geoip-ru -> «Без VPN», то есть ровно как сейчас, но с проходом
  # правил на каждый DNS-диал, а пока geoip-ru не скачан — через MATCH в туннель.
  #
  # Outbound type: dns (dns-out) тоже не нужен: tun.dns-hijack any:53 (FlClashX
  # пишет его всегда) ловит 53/tcp и 53/udp в sing-tun ДО движка правил
  # (listener/sing_tun/dns.go, ShouldHijackDns) — правило DST-PORT,53 не
  # сработает никогда.
  respect-rules: false
  # ЗАДАНО ЯВНО: от fake-ip-filter-mode зависит ВЕСЬ смысл списка ниже.
  # blacklist (дефолт) = перечисленное НЕ получает fake-IP. whitelist
  # перевернул бы список наизнанку и сломал маршрутизацию молча.
  fake-ip-filter-mode: blacklist
  fake-ip-ttl: 1
  fake-ip-filter:
    # --- Домены, которые ПУБЛИЧНЫЙ DNS резолвит в локальный адрес ---
    # Классика fake-ip: имя вида 192-168-1-5.<id>.plex.direct отдаёт адрес
    # твоей же локалки — так Plex выдаёт валидный TLS-сертификат на локальное
    # соединение. С fake-ip клиент получает 198.18.x.x и локальное
    # воспроизведение отваливается. Дальше реальный адрес ловит geoip-private.
    - "+.plex.direct"
    # Mijia — бренд умного дома Xiaomi, под общие суффиксы не подпадает.
    # miot-spec.org нужен интеграции Xiaomi в Home Assistant.
    - "+.mijia.tech"
    - "+.miot-spec.org"
    - "+.quickconnect.to"
    # --- Локальные веб-морды роутеров ---
    - "router.asus.com"
    - "+.tplinkwifi.net"
    - "+.routerlogin.net"
    # --- Проверка связи и автообнаружение прокси ---
    # Firefox проверяет капитивный портал сам, независимо от системы.
    - "detectportal.firefox.com"
    # wpad резолвится в локалке; с fake-ip браузер полезет за PAC-файлом
    # на несуществующий адрес и подвиснет на таймауте.
    - "wpad.*"
    - rule-set:geosite-private
    - "+.lan"
    - "+.local"
    - "*.stun.*"
    - "stun.*"
    # NTP. +.pool.ntp.org суффиксный, поэтому ловит и 2.android.pool.ntp.org —
    # сервер AOSP по умолчанию. time.android.com добавлен для прошивок,
    # которые берут время не из пула.
    - "pool.ntp.org"
    - "+.pool.ntp.org"
    - "time.android.com"
    - "time.google.com"
    # Веб-морды и облака домашних роутеров: адрес должен быть настоящим,
    # иначе устройство в локалке не найдётся.
    - "+.keenetic.net"
    - "+.keenetic.link"
    - "+.mykeenetic.net"
    - "+.miwifi.com"
    - "+.yeelight.com"
    - "+.yeelink.com"
    - "+.xiaomi.com"
    - "+.mi.com"
    - "+.miot.com"
    - "+.tp-link.com"
    - "connectivitycheck.gstatic.com"
    - "+.progress.me"
    - "+.progressme.ru"
    - "+.edvibe.com"
    - "+.calls.okcdn.ru"
    - "+.home.arpa"
    - "+.connectivitycheck.android.com"
    - "+.clients3.google.com"
    - "+.mtalk.google.com"
    - "+.fcm.googleapis.com"
    - "+.fcm-xmpp.googleapis.com"
    - "+.hicloud.com"
    - "+.dbankcloud.com"
    # Узлы операторов для Wi-Fi Calling: шлюз ePDG (epdg.epc.mncXXX.mcc250…),
    # у МегаФона ещё xcap.ims и bsf, у МТС aes. Страховка для прошивок с IMS
    # от Qualcomm/MediaTek (MIUI, ColorOS, OxygenOS): как они резолвят шлюз
    # при VPN — не проверить. AOSP IWLAN (Pixel) и так ходит мимо туннеля:
    # registerSystemDefaultNetworkCallback + DnsResolver.query(network) от
    # android.uid.system. Маршрут и DNS — через custom-direct.
    - "+.pub.3gppnetwork.org"
  # Нужен только чтобы резолвить ДОМЕННЫЕ ИМЕНА DNS-серверов.
  # Все наши серверы заданы адресами, так что одной строки хватает.
  default-nameserver:
    - 77.88.8.8
  nameserver: *dns_proxy
  # Домен ноды резолвится напрямую: российский DNS + DNS текущей сети.
  # Ключевая строка всей отказоустойчивости: чтобы поднять туннель,
  # туннель не нужен.
  proxy-server-nameserver: *dns_direct
  # Резолв хоста для выхода «Без VPN». Без ключа это основной резолвер
  # (hub/executor/executor.go, updateDNS), и домены директа вне RU-политики —
  # проп-фирмы, PROCESS-приложения, «Google Поиск» -> Без VPN — резолвились
  # ЧЕРЕЗ туннель. DIRECT диалит именно Host (adapter/outbound/direct.go,
  # RemoteAddress), а Host восстанавливается и для реальных IP
  # (dns/middleware.go, withMapping активен и в fake-ip). Туннель умер —
  # умирал и прямой трафик, плюс ответ был привязан к ноде.
  direct-nameserver: *dns_direct
  # ОБЯЗАТЕЛЬНО true: без policy +.lan, geosite-private и прочие имена
  # с system ушли бы в Яндекс -> NXDOMAIN -> морда роутера не откроется.
  # С true policy проверяется первой, direct-nameserver — для остального.
  direct-nameserver-follow-policy: true
  nameserver-policy:
    "rule-set:geosite-private":
      - system
    # Рекламные домены. В fake-ip на A/AAAA/HTTPS отвечает withFakeIP
    # (dns/middleware.go) ДО policy, поэтому rcode://success срабатывает
    # только на прочих типах (TXT, MX, SRV…). Рекламу режет правило
    # RULE-SET,ads-all,REJECT ниже; ключ оставлен ради остальных типов.
  # "rule-set:ads-all": rcode://success   # ⛔ ОТКЛЮЧЕНО 18.09.2026
    # +.routerlogin.net — локальное имя роутера Netgear, в private.list есть
    # только routerlogin.com. Резолвить обязан сам роутер: policy тут
    # first-match-wins по порядку (dns/resolver.go:271), а этот ключ выше
    # ключа с custom-direct, поэтому system побеждает dns_ru.
    "+.lan,+.local,+.home.arpa,+.routerlogin.net":
      - system
    "rule-set:youtube,category-ban-ru,whatsapp_domains,telegram_domains,discord_domains,meta_domains,instagram,instagram_ads,twitter_domains,google-play": *dns_proxy
    "rule-set:geosite-ru,custom-direct,torrent-trackers,tiktok,ru-direct-inline": *dns_ru
    "+.fcm.googleapis.com,+.fcm-xmpp.googleapis.com,+.mtalk.google.com": *dns_ru
    # NTP — российским резолвером и НАПРЯМУЮ. Так встроенный ntp: выше и
    # системная синхронизация времени работают с первой секунды, не дожидаясь
    # поднятого туннеля. Часы — предусловие REALITY, см. комментарий у ntp:.
    "time.google.com,+.pool.ntp.org,time.android.com,time.apple.com": *dns_ru

proxy-groups:
# ЗАЧЕМ У КАЖДОЙ ГРУППЫ ЯВНЫЙ url. Если ключ опустить, ядро подставляет
# C.DefaultTestURL (constant/adapters.go:64), но Selector.MarshalJSON
# (adapter/outboundgroup/selector.go:63) в этом случае СОЗНАТЕЛЬНО отдаёт
# в API пустой "testUrl" — чтобы панель использовала свою настройку.
# Панель, которая вернёт эту пустую строку обратно в ?url=, получит отказ:
# urlToMetadata("") падает на "scheme not Support" (adapter/adapter.go),
# и /group/{name}/delay отвечает 504 «all proxies timeout». Пинга нет.
# Явный URL снимает всю эту цепочку.
#
# interval у select-групп НЕ ставим намеренно. parser.go:169 не подставляет
# ему дефолт («select don't need auto health check»), а HealthCheck.auto()
# при interval=0 не запускает цикл вовсе. Проверка остаётся по требованию,
# и мы не тратим коннекты к ноде — их и так лимит 3 из-за ТСПУ.

  # ==========================================
  # ГЛАВНОЕ МЕНЮ (видимое)
  # ==========================================
  - name: Основной профиль
    type: select
    url: https://connectivitycheck.gstatic.com/generate_204
    expected-status: 204
    # Страховка для бейджа пинга в строке этой группы. Панель показывает
    # пинг ВЫБРАННОГО участника (now), а своя history у группы не заполняется
    # никогда — только у тех, кого она проверяет. Без этой строки при выборе
    # ⚡ AUTO (а он первый, то есть дефолтный) в строке был бы прочерк:
    # ⚡ AUTO больше никуда не входит, поэтому своей history у него нет.
    # Проверено на живом ядре.
    #
    # 1800, а НЕ 300, как у остальных групп: панель подставляет в proxies:
    # весь список узлов, и health-check пойдёт по всем — ровно дублируя
    # работу ⚡ AUTO. Бейджу свежесть в пять минут не нужна, а нагрузка
    # на ноду делится на шесть. lazy: true снимает проверку, когда группой
    # никто не пользуется; первый замер всё равно делается сразу при старте.
    interval: 1800
    lazy: true
    exclude-filter: *no_service
    include-all-proxies: true
    proxies:
      - ⚡ AUTO

  - name: Без VPN
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png
    type: select
    url: https://connectivitycheck.gstatic.com/generate_204
    expected-status: 204
    # interval здесь НЕ для самой группы, а ДЛЯ ЕЁ УЧАСТНИКОВ: своя history
    # у группы не заполняется никогда, заполняется history тех, кого она
    # проверяет (проверено на живом ядре). Панель показывает в строке пинг
    # выбранного участника — без этой строки там прочерк.
    # Проверяется ТОЛЬКО собственный список proxies: (parser.go отдаёт в
    # NewCompatibleProvider именно его). Узлы, приехавшие через use: или
    # из панели, сюда не попадают — у них свой health-check провайдера.
    interval: 300
    hidden: true
    proxies:
      - DIRECTv4

  # ==========================================
  # СКРЫТЫЕ АВТОМАТИЗАТОРЫ
  # ==========================================
  # Настройки проверки здоровья — в якоре hc_auto наверху файла.
  - name: ⚡ AUTO
    <<: *hc_auto
    type: fallback
    url: https://connectivitycheck.gstatic.com/generate_204
    expected-status: 204
    include-all-proxies: true
    exclude-filter: *no_service

  # Группы для конкретных сервисов
  #
  # Группы YouTube здесь больше нет (D-81). Она умела ровно одно: отправить
  # YouTube в тот же «Основной профиль», куда он и так попадал, — и при этом
  # занимала строку на экране выбора узла. Само правило маршрутизации осталось
  # и стоит там же: без него YouTube ловится списком geoip-ru (кеши Google
  # стоят у российских операторов) и уходит мимо туннеля.
  - name: "Google Поиск"
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png
    type: select
    url: https://connectivitycheck.gstatic.com/generate_204
    expected-status: 204
    # interval здесь НЕ для самой группы, а ДЛЯ ЕЁ УЧАСТНИКОВ: своя history
    # у группы не заполняется никогда, заполняется history тех, кого она
    # проверяет (проверено на живом ядре). Панель показывает в строке пинг
    # выбранного участника — без этой строки там прочерк.
    # Проверяется ТОЛЬКО собственный список proxies: (parser.go отдаёт в
    # NewCompatibleProvider именно его). Узлы, приехавшие через use: или
    # из панели, сюда не попадают — у них свой health-check провайдера.
    interval: 300
    proxies:
      - Основной профиль
      - Без VPN

rule-providers:
  # ==========================================================================
  #  БЛОКИРОВКА РЕКЛАМЫ — СПИСОК zxc-rv, ЗАТОЧЕННЫЙ ПОД РФ
  # ==========================================================================
  #  Короткая история, чтобы не наступить второй раз. Сначала этот провайдер
  #  перевели на список MetaCubeX ради экономии памяти. Аудит показал, что
  #  тот режет не только рекламу: в нём лежат graph.whatsapp.com,
  #  graph.whatsapp.net, graph.instagram.com и graph-fallback.instagram.com —
  #  рабочие API-эндпоинты. Побочно это глушило половину правила
  #  RULE-SET,instagram_ads,Основной профиль, заведённого чтобы НЕ ломать ленту.
  #
  #  Проверка декодером mrs показала, что дефект был свойством ИМЕННО списка
  #  MetaCubeX, а не блокировки рекламы. У zxc-rv (227 375 записей) пересечения
  #  с сервисными наборами только по честной рекламе и телеметрии
  #  (ads.youtube.com, analytics.facebook.com, pixel.facebook.com,
  #  ads-twitter.com, analytics.tiktok.com) и по тайпсквотам-фишингу
  #  (instagrem.com, facebgook.com, lnstagram-help.com) — их блокировать
  #  как раз правильно. У WhatsApp, Telegram, Discord и Google Play — ноль.
  #
  #  Цена: 1898.5 КБ на диске -> 3458.4 КБ резидентно (mrs сжат zstd и в RAM
  #  разворачивается примерно вдвое). Это 5-10% от RSS ядра. На слабых
  #  устройствах вклад в LMK есть, но причиной проблем на Infinix был
  #  find-process-mode: always, а не этот список.
  #
  #  ⚠️ Всё ниже отключено 18.09.2026. Имя ads-all связывает четыре места:
  #  провайдер здесь, ключ nameserver-policy, правило в rules и зеркало
  #  в sub-rules.quic. Включать — только все четыре сразу.
  #
  #  Закомментированная строка — международный список MetaCubeX. Включать
  #  только вместе с allowlist на graph.* эндпоинты, иначе см. выше.
  # ⛔ ОТКЛЮЧЕНО 18.09.2026. Блокировка рекламы убрана целиком: список резал рабочие
  #    хосты сервисов (api.whatsapp.net, i.instagram.com, cs.avito.ru), а стоял выше
  #    правил маршрутизации, поэтому WhatsApp, Instagram и Авито ломались (F-76).
  #    Вернуть — раскомментировать здесь, правило в rules, зеркало в sub-rules.quic
  #    и политику DNS.
  # ads-all:
  # <<: *rp_domain
  # #url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ads-all.mrs
  # url: https://github.com/zxc-rv/ad-filter/releases/latest/download/adlist.mrs
  # path: ./ads_all.mrs
  # ================= Локальная сеть =================
  geosite-private:
    <<: *rp_domain
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs
    path: ./geosite-private.mrs
  geoip-private:
    <<: *rp_ipcidr
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.mrs
    path: ./geoip-private.mrs
  # ================= Торренты =================
  torrent-trackers:
    <<: *rp_domain
    url: https://cdn.jsdelivr.net/gh/legiz-ru/mihomo-rule-sets@main/other/torrent-trackers.mrs
    path: ./rule-sets/torrent-trackers.mrs
  # ==========================================================================
  #  ТОРРЕНТЫ — ТРИ РАЗНЫХ СПИСКА, ТРИ РАЗНЫХ РЕШЕНИЯ
  # ==========================================================================
  #  torrent-clients  (classical, PROCESS-NAME) -> НАПРЯМУЮ.
  #    112 записей. Вопреки первому впечатлению это НЕ Windows-only список:
  #    22 записи с .exe, часть — имена процессов macOS/Linux, и 39 записей —
  #    пакеты Android: org.proninyaroslav.libretorrent, com.utorrent.client,
  #    hu.tagsoft.ttorrent.lite, com.delphicoder.flud, intelligems.torrdroid,
  #    com.biglybt.android.client, ru.yourok.torrserve, com.bitcomet.android,
  #    org.equeim.tremotesf, mobi.zona и т. д. На Android работает.
  #    Стоит В НИЖНЕМ PROCESS-БЛОКЕ: правило PROCESS-based, а значит платит
  #    резолвом процесса, и поднимать его выше нельзя.
  #
  #  torrent-trackers (domain)   -> НАПРЯМУЮ. Анонсы и DHT-бутстрап: пиринг
  #    через ноду не нужен никому, а по бюджету коннектов он смертелен.
  #
  #  torrent-websites (domain)   -> В ТУННЕЛЬ. Это сайты-каталоги (rutracker
  #    и подобные), их режет РКН. Именно за ними человек и включает VPN.
  #
  #  ⚠️ Раздача через туннель НЕ включается: пиры и DHT ловятся правилом
  #  torrent-clients напрямую, и оно стоит ВЫШЕ NETWORK,udp,REJECT, поэтому
  #  UDP торрента остаётся живым на прямом канале.
  torrent-clients:
    <<: *rp_classical
    url: https://cdn.jsdelivr.net/gh/legiz-ru/mihomo-rule-sets@main/other/torrent-clients.yaml
    path: ./rule-sets/torrent-clients.yaml
  # ЗАГОТОВКА ДЛЯ РУЧНОГО ПОПОЛНЕНИЯ. Клиенты, которых НЕТ в списке legiz.
  # Без такой строки торрент-приложение падает в MATCH,Основной профиль —
  # то есть ВСЕ ЕГО ПИРЫ едут через ноду. Это худший из возможных исходов:
  # и бюджет коннектов, и вопросы к хостеру.
  #
  # type: inline — работает с первой секунды, скачивать нечего.
  # behavior: classical — только он понимает PROCESS-NAME.
  #
  # ⚠️ ИМЯ ПАКЕТА С ОПЕЧАТКОЙ НЕ ДАЁТ ОШИБКИ — правило просто молча никогда
  # не сработает. Брать имена только с устройства: в FlClashX экран
  # управления доступом показывает package name каждого приложения.
  #
  # Проверено, что этих в legiz-списке нет. Ниже — только те, в чьих именах
  # я уверен; остальное дописывать по факту с устройств.
  #
  # ✅ ru.yourok.torrserve (TorrServe MatriX) в legiz УЖЕ ЕСТЬ — не дублировать.
  #
  # НЕ ДОБАВЛЯТЬ СЮДА КАТАЛОГИ. Lampa (top.rootu.lampa), NUM (ru.yourok.num),
  # Stremio — это витрины, а не клиенты. Им нужен туннель, и они его уже
  # получают через MATCH. Уведёшь их сюда — поломаешь выдачу.
  #
  # ИСКЛЮЧЕНИЕ: лаунчер со ВСТРОЕННЫМ TorrServer (некоторые сборки Lampa,
  # прошивки вроде Prisma) — это один процесс, который делает и то, и другое.
  # Его сюда добавлять МОЖНО и нужно: RULE-SET,torrent-websites стоит ВЫШЕ
  # этого правила, поэтому каталог всё равно уйдёт в туннель, а пиры — прямо.
  torrent-clients-extra:
    type: inline
    behavior: classical
    payload:
      - PROCESS-NAME,com.frostwire.android      # FrostWire
      - PROCESS-NAME,com.vuze.android.remote    # Vuze / BiglyBT Remote
  torrent-websites:
    <<: *rp_domain
    url: https://cdn.jsdelivr.net/gh/legiz-ru/mihomo-rule-sets@main/other/torrent-websites.mrs
    path: ./rule-sets/torrent-websites.mrs
  # ================= Соцсети и Мессенджеры =================
  whatsapp_domains:
    <<: *rp_domain
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/whatsapp.mrs
    path: ./rule-sets/whatsapp_domains.mrs
  meta_ips:
    <<: *rp_ipcidr
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/facebook.mrs
    path: ./rule-sets/meta_ips.mrs
  meta_domains:
    <<: *rp_domain
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/facebook.mrs
    path: ./rule-sets/meta_domains.mrs
  telegram_domains:
    <<: *rp_domain
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/telegram.mrs
    path: ./rule-sets/telegram_domains.mrs
  telegram_ips:
    <<: *rp_ipcidr
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/telegram.mrs
    path: ./rule-sets/telegram_ips.mrs
  telegram_additional_ips:
    <<: *rp_classical
