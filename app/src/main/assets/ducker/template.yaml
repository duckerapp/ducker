x-anchors:
  reserved_ips: &reserved_ips
    - 0.0.0.0/8
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 192.168.0.0/16
    - 198.51.100.0/24
    - 203.0.113.0/24
    - 224.0.0.0/3
    - ::/127
    - fc00::/7
    - fe80::/10
    - ff00::/8

  dns_ru: &dns_ru
    - 77.88.8.8
    - 77.88.8.1

  dns_direct: &dns_direct
    - system
    - 77.88.8.8
    - 77.88.8.1

  dns_proxy: &dns_proxy
    - tcp://1.1.1.1#Основной профиль

  pr_http: &pr_http
    type: http
    interval: 259200
    proxy: Основной профиль

  rp_classical: &rp_classical
    <<: *pr_http
    behavior: classical
    format: yaml

  rp_domain: &rp_domain
    <<: *pr_http
    behavior: domain
    format: mrs

  rp_ipcidr: &rp_ipcidr
    <<: *pr_http
    behavior: ipcidr
    format: mrs

  hc_auto: &hc_auto
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png
    url: https://connectivitycheck.gstatic.com/generate_204
    interval: 300
    timeout: 7000
    max-failed-times: 3
    expected-status: 204
    hidden: true
    lazy: true

  no_service: &no_service "(?i)Без VPN|DIRECTv4"

tcp-concurrent: true
mode: rule
log-level: error
ipv6: true
unified-delay: true

allow-lan: false
etag-support: true
geo-auto-update: false
geo-update-interval: 24

find-process-mode: strict

keep-alive-idle: 30
keep-alive-interval: 10

ntp:
  enable: true
  server: pool.ntp.org
  port: 123
  interval: 30
  write-to-system: false

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  override-destination: true
  parse-pure-ip: true
  force-dns-mapping: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-dst-address:
    - 0.0.0.0/8
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 192.168.0.0/16
    - 198.51.100.0/24
    - 203.0.113.0/24
    - 224.0.0.0/3
    - ::/127
    - fc00::/7
    - fe80::/10
    - ff00::/8
    - rule-set:telegram_ips

