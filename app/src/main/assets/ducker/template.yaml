      - DOMAIN-KEYWORD,wildberries
      - DOMAIN-KEYWORD,aliexpress
      # --- Спорные, вынесены отдельно, включай осознанно ---
      # wink   — подстрока: ловит любой домен со «wink» внутри (twinkle.com)
      # premier — ловит premierleague.com, premierinn.com и прочее зарубежное
      # - DOMAIN-KEYWORD,wink
      # - DOMAIN-KEYWORD,premier
      #
      # Зарубежные сервисы, которые сами блокируют российские адреса.
      # Направив их напрямую, ты их и выключишь. Проверь каждый на себе.
      # - DOMAIN-KEYWORD,shutterstock
      # - DOMAIN-KEYWORD,researchgate
      # - DOMAIN-KEYWORD,springer
      # - DOMAIN-SUFFIX,avira.com

  # ================= Обход DNS мимо mihomo =================
  # Приложения и браузеры со СВОИМ шифрованным DNS уносят резолв
  # за пределы ядра: fake-ip не работает, разделение RU/мир ломается,
  # трафик уезжает не туда. С августа 2026 это ещё и просто не работает —
  # операторы РФ рвут DoH/DoT к Google и Cloudflare на этапе TLS.
  # Пользователь видит «интернет не работает при включённом VPN».
  #
  # Просить сорок человек лезть в настройки бесполезно. Вместо этого
  # роняем такие попытки БЫСТРО: приложение получает отказ и штатно
  # откатывается на обычный DNS через 53 -> сюда, в mihomo.
  #
  # Куда смотреть пользователю, если он всё же хочет выключить руками:
  #   Android:  Настройки -> Сеть -> Частный DNS -> Автоматически/Выкл
  #   Chrome:   Настройки -> Конфиденциальность -> Использовать
  #             безопасный DNS -> выключить
  #   Firefox:  Настройки -> DNS через HTTPS -> Выкл
  #
  # Синтаксис: "+.foo" ловит и сам foo, и все поддомены, и НЕ ловит
  # notfoo или foo.evil.com — проверено на component/trie (Insert
  # раскладывает "+." в два узла: сам домен и wildcard-поддомены).
  # Поэтому отдельная строка вида "dns.google" рядом с "+.dns.google"
  # не нужна.
  #
  # РАБОТАЕТ ДАЖЕ КОГДА КЛИЕНТ ИДЁТ ПО IP. Windows 11 «Шифрованный DNS»
  # коннектится на 8.8.8.8:443 или 1.1.1.1:443 напрямую, домена
  # в назначении нет. Но сниффер TLS достаёт SNI, кладёт его
  # в metadata.SniffHost (component/sniffer/dispatcher.go:170 — БЕЗУСЛОВНО,
  # независимо от override-destination), а все доменные правила матчатся
  # через metadata.RuleHost(), которое предпочитает SniffHost
  # (constant/metadata.go:270). Порт 443 у нас сниффается, значит ловится.
  #
  # DoH поверх HTTP/3 режут первые строки sub-rules.quic — ДО geosite-ru.
  # Без них российские DoH из geosite-ru (dns.comss.one, xbox-dns.ru,
  # dns.astracat.ru, dns.geohide.ru) уходили бы по HTTP/3 напрямую.
  # ECH мог бы спрятать SNI, но для него нужна HTTPS-запись (qType 65),
  # а нода отдаёт на неё пустой NOERROR. Круг замкнут.
  doh-bypass:
    type: inline
    behavior: domain
    payload:
      - "+.dns.google"
      - "+.cloudflare-dns.com"
      - "one.one.one.one"
      - "+.dns.quad9.net"
      - "+.adguard-dns.com"
      - "+.dns.nextdns.io"
      - "+.doh.opendns.com"
      - "+.dns.controld.com"
      - "+.doh.cleanbrowsing.org"
      - "+.dns.sb"
      - "+.doh.mullvad.net"
      # --- Российские сервисы. Их РКН НЕ блокирует, и в этом вся беда: ---
      # пользователь не увидит ошибки, а разделение RU/мир у него молча
      # сломается — резолв уйдёт мимо ядра, fake-ip перестанет работать,
      # трафик поедет не туда. У xbox-dns вдобавок своя подмена адресов
      # для «разблокировки», и поверх нашего туннеля это двойная
      # маршрутизация с непредсказуемым результатом.
      # Под VPN оба избыточны: он уже разблокирует всё, ради чего их ставят.
      - "+.comss.one"        # DoH https://dns.comss.one/dns-query, DoT, DoQ
      - "+.xbox-dns.ru"      # DoH https://xbox-dns.ru/dns-query, DoT xbox-dns.ru

  # Официальный список DoH/DoT-эндпоинтов из meta-rules-dat. Проверено:
  # 126 записей — 123 точных хоста + ровно три суффикса (+.opendns.com,
  # +.cloudflare-dns.com, +.nextdns.io). Доменов общего назначения нет,
  # так что REJECT по нему безопасен.
  #
  # Он ДОПОЛНЯЕТ инлайн doh-bypass выше, а не заменяет его: в category-doh
  # нет +.dns.controld.com и doh.mullvad.net, а наши записи с "+." шире
  # точных хостов из списка. Со своей стороны category-doh закрывает то,
  # чего нет у нас: dns.astracat.ru, dns.geohide.ru, dns.mafioznik.xyz,
  # dnsguard.pub, *.cloudflare-gateway.com, doh.360.cn, *.doh.sb и DoT
  # Яндекса (common/safe/family.dot.dns.yandex.net).
  category-doh:
    <<: *rp_domain
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-doh.mrs
    path: ./rule-sets/category-doh.mrs

  # Десять определялок IP одним набором вместо десяти отдельных правил.
  # В behavior: domain простая запись = точное совпадение, то есть семантика
  # ровно та же, что у DOMAIN,... Пускаем в прокси, чтобы пользователь видел
  # адрес ноды, а не свой.
  ip-checkers:
    type: inline
    behavior: domain
    payload:
      - flclashx.app
      - ipwho.is
      - api.myip.com
      - ipapi.co
      - ident.me
      - ip-api.com
      - ipinfo.io
      - api.ip.sb
      - 2ip.io
      - 2ipcore.com
      # Дописано 22.09.2026 (D-81). Этих в списке не было, и они уходили мимо
      # туннеля: домен не подходит ни под одно правило выше, а ниже его ловит
      # geoip-ru. Человек открывал определялку, видел свой домашний адрес
      # и решал, что VPN не работает. Проверено на устройстве: api.ipify.org
      # и ifconfig.me отдавали адрес провайдера при поднятом туннеле.
      - api.ipify.org
      - ipify.org
      - ifconfig.me
      - ifconfig.co
      - icanhazip.com
      - myip.wtf
      - wtfismyip.com
      - checkip.amazonaws.com
      - ipecho.net
      - whatismyipaddress.com

  custom-direct:
    type: inline
    behavior: domain
    payload:
      - "+.yastatic.net"
      - "+.yandex.com"
      - "+.calls.okcdn.ru"
      - "+.gosuslugi.ru"
      - "+.connectivitycheck.gstatic.com"
      - "+.mtalk.google.com"
      - "+.pushtrs.push.hicloud.com"
      - "+.pushtrs1.push.hicloud.com"
      - "+.token-drcn.push.dbankcloud.com"
      - "+.intercom.io"
      - "+.intercomcdn.com"
      - "+.cloudstori.com"
      - "+.progress.me"
      - "+.progressme.ru"
      - "+.edvibe.com"
      # Умный дом. Домены уже были в fake-ip-filter (то есть получали реальный
      # адрес), но ни одно правило не отправляло их напрямую — и они уезжали
      # в туннель через MATCH. Из-за этого приложения вроде Mi Home ходят
      # в облако через зарубежный узел и отдают туннельный адрес при установке
      # P2P, отчего камеры открываются нестабильно и с плохим качеством.
      - "+.xiaomi.com"
      - "+.mi.com"
      - "+.miot.com"
      - "+.miwifi.com"
      # Проверки связи и капитивного портала — ТОЛЬКО НАПРЯМУЮ.
      # Их смысл в том, чтобы проверить НИЖНЮЮ сеть. Через туннель они
      # рапортуют «интернет есть» всегда, пока жив туннель, и система
      # перестаёт замечать капитивный портал в отеле или кафе.
      # Домены уже были в fake-ip-filter, но маршрута в direct не имели
      # и уезжали в туннель — видно в логах: ping.archlinux.org и
      # detectportal.firefox.com шли через Франкфурт.
      - "+.detectportal.firefox.com"
      - "+.connectivitycheck.android.com"
      - "+.clients3.google.com"
      # Узлы операторов для Wi-Fi Calling (пара к записи в fake-ip-filter):
      # если IKE/IPsec зайдёт в TUN, оператор должен видеть российский адрес.
      - "+.pub.3gppnetwork.org"
      - "+.mijia.tech"
      - "+.miot-spec.org"
      - "+.yeelight.com"
      - "+.yeelink.com"
      - "+.tp-link.com"
      # Роутеры и NAS с удалённым доступом. Лежали в fake-ip-filter (то есть
      # получали реальный адрес), но ни одно правило не гнало их в директ —
      # уезжали в MATCH, в туннель. Тот же класс дефекта, что был с Mi Home:
      # облако видит адрес ноды и NAT-проброс к домашнему устройству ломается.
      - "+.quickconnect.to"
      - "+.routerlogin.net"
      - "+.keenetic.net"
      - "+.keenetic.link"
      - "+.mykeenetic.net"
      - "+.hicloud.com"
      - "+.dbankcloud.com"
      - "ip.mail.ru"
      - "ipv4-internet.yandex.net"
      - "ipv6-internet.yandex.net"
sub-rules:
  # ЗЕРКАЛО основного списка для UDP/443, порядок тот же.
  #
  # REJECT-строки основного списка (DoH, реклама) повторять ОБЯЗАТЕЛЬНО
  # и СТРОГО ВЫШЕ geosite-ru: калитка QUIC стоит в rules выше их, а в
  # geosite-ru целые зоны ru, su, by, рф, yandex. Без этих строк 3290
  # доменов ads-all (mc.yandex.ru, an.yandex.ru, ads.adfox.ru,
  # top-fwz1.mail.ru), ещё 29 из ru-direct-inline (ads.vk.com,
  # appmetrica.yandex.net) и российские DoH (dns.comss.one, xbox-dns.ru)
  # шли по HTTP/3 НАПРЯМУЮ, мимо блокировки.
  #
  # ПРЯМЫЕ правила зеркалить не обязательно: здесь нет torrent-trackers,
  # tiktok, проп-фирм — несовпавшее уходит в MATCH,REJECT, то есть такой
  # адрес просто теряет HTTP/3 и откатывается на TCP. Ошибка безобидная.
  #
  # ru-app-list отсюда УБРАН: он PROCESS-based, то есть заставлял бы ядро
  # резолвить процесс на КАЖДОЙ UDP/443-сессии — ради приложений, которые
  # и так вынесены из туннеля через tun.exclude-package.
  quic:
    - RULE-SET,doh-bypass,REJECT
    - RULE-SET,category-doh,REJECT
    - RULE-SET,custom-direct,Без VPN
    # Ниже custom-direct, как в основном списке: ручные исключения из
    # рекламного списка обязаны работать и по HTTP/3.
    # - RULE-SET,ads-all,REJECT   # ⛔ ОТКЛЮЧЕНО 18.09.2026
    # Заблокированные в РФ режем ПЕРВЫМИ, до строки рунета: в основном
    # списке они уходят в туннель, а туннельный QUIC нам не нужен.
    # Без этой строки geosite-ru (там сплошной +.ru) накрыл бы их и пустил
    # QUIC напрямую — браузер попробовал бы H3, получил тишину от ТСПУ
    # и затупил, причём из-за кэша Alt-Svc не один раз.
    - RULE-SET,category-ban-ru,REJECT
    - RULE-SET,ru-direct-inline,Без VPN
    - RULE-SET,geosite-ru,Без VPN
    - RULE-SET,geoip-ru,Без VPN,no-resolve
    - MATCH,REJECT

rules:
  # ==========================================================================
  #  ЛОКАЛЬНАЯ СЕТЬ — ПЕРВОЙ ИЗ МАРШРУТНЫХ, СРАЗУ ЗА REJECT НА 853
  # ==========================================================================
  #  Стоит выше всех глобальных правил, включая блок QUIC. Иначе
  #  запрет UDP/443 накрывает и устройства в твоей же локалке.
  #  Здесь же живут fe80::/ULA, поэтому обнаружение устройств
  #  по IPv6 продолжает работать несмотря на REJECT ::/0 ниже.
  # ==========================================================================
  #  ⚠️ ПОРЯДОК ВАЖЕН: это правило обязано стоять раньше geoip-private. В обратном
  #  порядке она перехватит DoT на 172.19.0.2:853 и Android зациклит повторы.
  #  Явный REJECT, а не REJECT-DROP: отказ приходит сразу, и повторы прекращаются.
  - DST-PORT,853,REJECT
  - RULE-SET,geoip-private,Без VPN,no-resolve
  - RULE-SET,geosite-private,Без VPN

  # ==========================================================================
  #  🧱 QUIC РЕЖЕТСЯ ТОЛЬКО НА ТУННЕЛЬНОМ ПУТИ
  # ==========================================================================
  #  ПРЯМОЙ QUIC СОХРАНЯЕТСЯ. Список внутри sub-rules.quic отправляет
  #  российские адреса в «Без VPN», и HTTP/3 у них продолжает работать.
  #  Режется только то, что иначе уехало бы в туннель.
  #
  #  (Здесь раньше стоял блок «QUIC режется везде — и зарубежный,
  #  и российский». Он противоречил фактическому sub-rules.quic и удалён.)
  #
  #  Почему туннельный QUIC не нужен: двойной congestion control поверх
  #  TCP-носителя; при only-tcp: true ещё и отдельный коннект к ноде на
  #  каждый UDP-поток (бюджет ТСПУ — три), при false — HOL в общей несущей;
  #  мимо splice.
  #  К прямому каналу не относится ни один довод, а на слабом LTE QUIC
  #  заметно лучше переживает потери, чем TCP.
  #
  #  Как это выглядит для приложения: REJECT для UDP — это ТИХИЙ чёрный
  #  ящик, а не отказ. adapter/outbound/reject.go: nopPacketConn.WriteTo
  #  молча возвращает успех, ReadFrom отдаёт io.EOF. ICMP unreachable
  #  не шлётся. Браузер ждёт таймаута QUIC-хендшейка и откатывается на TCP —
  #  ровно как при блокировке ТСПУ. REJECT и REJECT-DROP для UDP
  #  практически неразличимы.
  #
  #  ---- КАК СДЕЛАТЬ ПО УМУ, ЕСЛИ ПОНАДОБИТСЯ ----
  #
  #  Чтобы пустить QUIC отдельным сервисам, ставь ИСКЛЮЧЕНИЯ ВЫШЕ
  #  этого правила — первое совпадение выигрывает. Например:
  #
  #    - AND,((RULE-SET,telegram_ips),(NETWORK,udp),(DST-PORT,443)),Основной профиль
  #    - AND,((RULE-SET,discord_domains),(NETWORK,udp),(DST-PORT,443)),Основной профиль
  #    - AND,((RULE-SET,geosite-ru),(NETWORK,udp),(DST-PORT,443)),Без VPN
  #
  #  ⚠️ ВАЖНО: на нодах в Xray стоит зеркальное правило
  #       {"ruleTag": "block-quic", "port": 443, "network": "udp",
  #        "outboundTag": "BLOCK"}
  #  Оно режет UDP/443 уже НА СЕРВЕРЕ. Поэтому исключение, добавленное
  #  только здесь, работать не будет: пакет дойдёт до ноды и умрёт там.
  #  Любое исключение надо заводить В ДВУХ МЕСТАХ — здесь и в маршрутизации
  #  ноды, выше правила block-quic (там оно называется allow-udp443-telegram).
  #  Серверное правило при этом не убирать: оно страхует клиентов
  #  на других приложениях и старых конфигах, у которых этой строки нет.
  #  Без него такой юзер пустит QUIC в туннель: при only-tcp: true это
  #  коннект на каждый поток и теневой бан ТСПУ на 120 секунд, при false —
  #  двойной congestion control и HOL в общей несущей.
  # ==========================================================================
  #  ПОРЯДОК УСЛОВИЙ ВНУТРИ AND — НЕ КОСМЕТИКА.
  #  Под-правила проверяются по очереди до первого несовпадения
  #  (rules/logic/logic.go, case C.AND). Если поставить RULE-SET первым,
  #  ipcidr-сет будет проверяться на КАЖДОМ соединении, а без no-resolve
  #  он ещё и дёрнет настоящий DNS-запрос: при fake-ip ядро обнуляет DstIP
  #  (tunnel/tunnel.go:296), и helper.ResolveIP() уходит в сеть.
  #  Дешёвые условия первыми, no-resolve обязателен.

  #  QUIC режем ТОЛЬКО на туннельном пути. Прямой трафик его сохраняет.
  #
  #  Все три довода за блокировку относятся исключительно к туннелю:
  #  двойной congestion control поверх TCP-носителя; при only-tcp: true
  #  отдельный коннект к ноде на каждый UDP-поток (бюджет ТСПУ — три), при
  #  false — HOL в общей несущей; мимо splice. К прямому каналу не относится
  #  ни один, а на слабом LTE QUIC заметно лучше переживает потери, чем TCP.
  #
  #  Список внутри ЗЕРКАЛИТ основной блок — тогда QUIC и TCP принимают
  #  одинаковое решение. Забыть там ПРЯМОЕ правило безобидно: адрес потеряет
  #  HTTP/3 и откатится на TCP. Забыть REJECT (DoH, реклама) — НЕТ: калитка
  #  стоит выше них, и geosite-ru внутри пустит такой домен по HTTP/3 напрямую.
  #
  #  MATCH,REJECT в конце ОБЯЗАТЕЛЕН: без него несовпавшее соединение
  #  проваливается обратно в основной список (rules/logic/logic.go:179)
  #  и уезжает в туннель — ровно то, что мы предотвращаем.
  #  ГОЛОС TELEGRAM ПО UDP/443 БОЛЬШЕ НЕ ПРОПУСКАЕТСЯ. Раньше здесь стояло
  #  исключение (telegram_ips и telegram_additional_ips -> туннель), теперь
  #  звонки уходят в общий блок QUIC и получают REJECT, то есть сваливаются
  #  на TCP-ретрансляцию. Качество звонков хуже, зато:
  #    - UDP/443 в туннель не идёт ни от одного сервиса, а при only-tcp: true
  #      каждая UDP-сессия открывала бы отдельный коннект к ноде;
  #    - снимается несимметричность: исключение стояло ВЫШЕ реджекта ::/0,
  #      поэтому UDP Телеграма по IPv6 проходил, а TCP по IPv6 резался.
  #  Зеркало на ноде (allow-udp443-telegram выше block-quic) осталось, но
  #  теперь ничего не ловит — вреда нет, при случае убрать.
  - SUB-RULE,(AND,((NETWORK,udp),(DST-PORT,443))),quic

  - IP-CIDR,::/0,REJECT,no-resolve

  # ==========================================================================
  #  🔒 ЗАКРЫВАЕМ ОБХОД DNS МИМО ЯДРА
  # ==========================================================================
  #  853 — это DoT и DoQ. Сюда ходит Android Private DNS и часть клиентов.
  #  dns-hijack в tun ловит только 53, поэтому 853 проходил бы мимо fake-ip
  #  и мимо всего разделения RU/мир. С августа 2026 он вдобавок просто рвётся
  #  операторами РФ, и пользователь видит «нет интернета» при включённом VPN.
  #  Быстрый REJECT -> система откатывается на 53 -> сюда.
  #
  #  Стоит НИЖЕ правил локальной сети, чтобы не задеть DoT на домашнем
  #  роутере, и НИЖЕ QUIC-блока, чтобы порядок оставался читаемым.
  #
  #  ⚠️ ЧТО ЭТО ДЕЛАЕТ С ANDROID PRIVATE DNS — ЗНАТЬ ОБЯЗАТЕЛЬНО.
  #  Private DNS применяется И К VPN-СЕТИ: в AOSP гейт
  #  isPrivateDnsValidationRequired() требует INTERNET, NOT_RESTRICTED,
  #  TRUSTED и СПЕЦИАЛЬНО НЕ требует NET_CAPABILITY_NOT_VPN (коммит
  #  «Support strict mode private DNS on VPNs that provide Internet»).
  #
  #    • Частный DNS = «Автоматически» → Android пробует 853 на DNS-сервере
  #      сети, получает здесь мгновенный отказ и штатно откатывается
  #      на чистый 53 → в dns-hijack. Пользователь ничего не замечает. ✅
  #    • Частный DNS = «Имя хоста провайдера» (strict) → отката в AOSP
  #      НЕ ПРЕДУСМОТРЕНО. Сеть помечается PRIVATE_DNS_BROKEN, DNS
  #      у приложений не работает: «нет интернета» при включённом VPN. ❌
  #
  #  Конфигом это не лечится (см. TUNED-CHANGES.md). Лечится на устройстве:
  #  Настройки → Сеть и интернет → Частный DNS → Автоматически/Выключено.
  #  Заметьте: в strict-режиме у клиента в РФ DNS сломан и БЕЗ нашего VPN —
  #  853 наружу режет оператор.
  #  ⚠️ Само правило перенесено в начало rules: там оно и срабатывает.
  #  Проверено 17.09.2026: пока оно стояло здесь, geoip-private перехватывал
  #  DoT на адрес виртуального DNS раньше, запрос уходил в «Без VPN», ядро
  #  блокировало дозвон на собственный адрес туннеля, и Android повторял
  #  попытку 901 раз за 9 секунд (FACTS.md, F-73). То есть конфигом это
  #  как раз лечится — порядком правил.
  - RULE-SET,doh-bypass,REJECT
  - RULE-SET,category-doh,REJECT

  # ==========================================================================
  #  ⏱ NTP — НАПРЯМУЮ, И ЭТО ОБЯЗАТЕЛЬНО ВЫШЕ NETWORK,udp,REJECT
  # ==========================================================================
  #  Домены пула уже есть в fake-ip-filter, но fake-ip-filter НЕ маршрутизирует.
  #  Без этих строк системная синхронизация времени падала бы в MATCH и ехала
  #  в туннель по UDP/123, а после catch-all ниже — просто умирала бы.
  #
  #  Часы — предусловие REALITY: component/tls/reality.go:71 зашивает
  #  ntp.Now().Unix() прямо в SessionId ClientHello, и сервер отвергает
  #  хендшейк за пределами допустимого расхождения. Уехавшие часы выглядят
  #  как «подключился и сразу отвалился».
  #
  #  Диапазоны UID у VpnService покрывают и системный uid 1000, поэтому
  #  системный SNTP действительно проходит через TUN и эти правила его ловят.
  #  Вторая, независимая страховка — блок ntp: в начале файла (внутреннее
  #  время самого ядра).
  - DOMAIN-SUFFIX,pool.ntp.org,Без VPN
  - DOMAIN,time.android.com,Без VPN
  - DOMAIN,time.google.com,Без VPN
  - DST-PORT,123,Без VPN

  - OR,((DST-PORT,5228-5230),(DOMAIN-KEYWORD,mtalk),(DOMAIN-SUFFIX,fcm.googleapis.com),(DOMAIN-SUFFIX,fcm-xmpp.googleapis.com)),Без VPN
  # Ручной список прямых исключений (Intercom, progress.me и прочее).
  # Стоит высоко намеренно: это единственный список, который переопределяет
  # автоматические наборы ниже, и решение здесь всегда за человеком.
  - RULE-SET,custom-direct,Без VPN
  # - RULE-SET,ads-all,REJECT   # ⛔ ОТКЛЮЧЕНО 18.09.2026
  # Трекеры и DHT — напрямую. Клиенты (PROCESS-NAME) ниже, в PROCESS-блоке.
  - RULE-SET,torrent-trackers,Без VPN
  - RULE-SET,tiktok,Без VPN
  # Проп-фирмы — НАПРЯМУЮ, мимо VPN (так задумано: нужен российский IP).
  # Кабинет, регистрация, KYC и заявки на выплату должны идти с реального
  # адреса: он совпадает с заявленной страной проживания и подтверждает KYC.
  # Разрешение FundingPips на туннель выдано ТОЛЬКО на MT5, не на кабинет.
  # Только DOMAIN-KEYWORD: он покрывает и сам домен, и все поддомены.
  # DOMAIN-KEYWORD это strings.Contains(RuleHost(), keyword)
  # (rules/common/domain_keyword.go), поэтому парные DOMAIN-SUFFIX,
  # стоявшие здесь раньше, были недостижимы — keyword ловил то же самое
  # с тем же таргетом.
  - DOMAIN-KEYWORD,fundingpips,Без VPN
  - DOMAIN-KEYWORD,fundednext,Без VPN
  # Виджет живого чата на сайтах обеих фирм. Сторонний сервис, но агент
  # поддержки видит тот IP, с которого пришёл чат — пусть совпадает с сайтом.
  - DOMAIN-SUFFIX,chatbot.com,Без VPN

  # ✈️ ВСЁ, ЧТО НИЖЕ — ИДЕТ ЧЕРЕЗ VPN ✈️
  - RULE-SET,telegram_domains,Основной профиль
  - RULE-SET,telegram_ips,Основной профиль,no-resolve
  - RULE-SET,telegram_additional_ips,Основной профиль,no-resolve
  - RULE-SET,youtube,Основной профиль
  - RULE-SET,whatsapp_domains,Основной профиль
  - RULE-SET,meta_domains,Основной профиль
  - RULE-SET,meta_ips,Основной профиль,no-resolve
  - RULE-SET,instagram,Основной профиль
  - RULE-SET,instagram_ads,Основной профиль
  - RULE-SET,twitter_domains,Основной профиль
  - RULE-SET,twitter_ips,Основной профиль,no-resolve
  - RULE-SET,google-play,Основной профиль
  - DOMAIN-SUFFIX,habr.com,Основной профиль
  - DOMAIN-SUFFIX,happ.su,Основной профиль
  - RULE-SET,category-ban-ru,Основной профиль
  # Сайты-каталоги торрентов (rutracker и подобные) режет РКН — в туннель.
  # Стоит ВЫШЕ torrent-clients: если сам клиент полезет на такой сайт за
  # .torrent-файлом, пусть идёт через туннель, иначе получит блокировку.
  - RULE-SET,torrent-websites,Основной профиль
  # Только поиск, а не вся экосистема Google.
  # DOMAIN-SUFFIX,google.com ловил бы ещё почту, диск и Meet — и при
  # переключении группы на «Без VPN» они уходили бы напрямую вместе
  # с поиском. Здесь переключается ровно выдача: нужен российский
  # Google, а не немецкий.
  - DOMAIN,www.google.com,Google Поиск
  - DOMAIN,google.com,Google Поиск
  - DOMAIN-SUFFIX,google.ru,Google Поиск
  # Discord: голос идёт на высокие порты, под блок UDP/443 не попадает
  # Порядок условий внутри AND: под-правила проверяются по очереди
  # до первого несовпадения (rules/logic/logic.go, case C.AND).
  # RULE-SET первым щупал бы ipcidr-сет на КАЖДОМ соединении, а без
  # no-resolve ещё и дёргал бы настоящий DNS-запрос: при fake-ip ядро
  # обнуляет DstIP (tunnel/tunnel.go:296), и helper.ResolveIP() уходит
  # в сеть. Дешёвые условия первыми, no-resolve обязателен.
  # Два диапазона в одной строке: 19200-19500 — управляющий канал Discord,
  # 50000-65535 — сам голос. Разделитель ВНУТРИ правила только "/": запятая
  # там занята под разделитель полей (rules/common/base.go:ParseRulePayload).
  # Строка разбирается на диапазоны один раз при загрузке конфига
  # (common/utils/ranges.go:newIntRanges, до 28 диапазонов), на матче это
  # просто скан среза. Слитая форма ДЕШЕВЛЕ двух отдельных: на любом
  # TCP-соединении условие NETWORK,udp отсекает один раз вместо двух.
  - AND,((NETWORK,udp),(DST-PORT,19200-19500/50000-65535),(RULE-SET,cloudflare_ips,no-resolve)),Основной профиль
  - AND,((NETWORK,udp),(DST-PORT,50000-65535),(RULE-SET,discord_voiceips,no-resolve)),Основной профиль
  - RULE-SET,discord_domains,Основной профиль

  - RULE-SET,ip-checkers,Основной профиль

  # ==========================================================================
  #  🔎 ЕДИНСТВЕННЫЙ БЛОК PROCESS-ПРАВИЛ — И ОН ЗДЕСЬ НЕ СЛУЧАЙНО
  # ==========================================================================
  #  При find-process-mode: strict ядро дёргает резолв процесса только когда
  #  матчинг ДОШЁЛ до PROCESS-правила. Значит цена блока = его позиция:
  #  всё, что поймано доменными и IP-правилами выше, резолв не оплачивает.
  #  Один резолв — это JNI-апкол + два binder IPC под семафором на 4.
  #  ДОБАВЛЯЯ СЮДА ПРАВИЛА, НЕ ПОДНИМАЙ БЛОК ВЫШЕ.
  #
  #  Верхняя граница подвижна, нижняя — НЕТ: блок обязан стоять ВЫШЕ
  #  ru-direct-inline / geosite-ru / geoip-ru, иначе российские домены увели бы
  #  WhatsApp и терминал в direct.
  #
  #  PROCESS-NAME на Android требует версии 10+ (API 29): FlVpnService
  #  резолвит uid через ConnectivityManager.getConnectionOwnerUid, который
  #  появился именно там. Package visibility (Android 11+) закрыта
  #  разрешением QUERY_ALL_PACKAGES в манифесте FlClashX.
  # Торрент-клиенты — НАПРЯМУЮ. Пиры и DHT через ноду не пускаем: это и
  # бюджет коннектов, и претензии к хостеру. Правило стоит выше
  # NETWORK,udp,REJECT, поэтому UDP торрента на прямом канале живёт.
  - RULE-SET,torrent-clients,Без VPN
  - RULE-SET,torrent-clients-extra,Без VPN
  - PROCESS-NAME,com.whatsapp,Основной профиль
  - PROCESS-NAME,com.tradingview.tradingviewapp,Основной профиль
  #  ru-app-list — СТРАХОВКА ПО IP, И ТОЛЬКО. Это НЕ эквивалент
  #  tun.exclude-package и не заменяет его:
  #    • правило чинит только исходящий адрес — трафик всё равно входит в TUN,
  #      приложение остаётся привязано к VPN-сети, и getActiveNetwork()
  #      у него отдаёт сеть с TRANSPORT_VPN;
  #    • exclude-package убирает UID из UID-диапазонов VpnService, и по доке
  #      Android такие приложения «use system networking as if the VPN wasn't
  #      running» — getActiveNetwork() возвращает Wi-Fi/Cellular
  #      с NET_CAPABILITY_NOT_VPN.
  #  Против встроенных определялок VPN работает ТОЛЬКО второе, поэтому
  #  список из 526 пакетов в tun.exclude-package — основной механизм,
  #  а эта строка нужна лишь для устаревших сборок клиента и для пакетов,
  #  которых в exclude-списке нет.
  - RULE-SET,ru-app-list,Без VPN

  # Встроенный список — работает сразу после установки, пока
  # geosite-ru ещё качается. Стоит ровно перед ним, чтобы поведение
  # с прогретым кэшем и без него совпадало.
  - RULE-SET,ru-direct-inline,Без VPN
  - RULE-SET,geosite-ru,Без VPN #domen базы
  - RULE-SET,geoip-ru,Без VPN,no-resolve #ip базы
  # ==========================================================================
  #  ПОЧЕМУ ЗДЕСЬ НЕТ CATCH-ALL ПО UDP
  # ==========================================================================
  #  Строка NETWORK,udp,<...> перед MATCH тут была и убрана намеренно.
  #  Непойманный UDP (игра вне списков, браузерный WebRTC, P2P умного дома)
  #  уходит в туннель через MATCH — медленно, но работает. Так же устроены
  #  профили windows, arch и ios: catch-all нет нигде.
  #
  #  REJECT здесь ломал мобильные игры на не-443 UDP, а «Без VPN» отправлял бы
  #  весь непойманный UDP напрямую, чего не хотим.
  #
  #  Цена текущего решения, зафиксированная явно: такая UDP-сессия едет
  #  UDP-over-TCP (adapter/outbound/vless.go: ListenPacketContext диалит TCP),
  #  то есть с лагом. При only-tcp: true в мультиплексе она ещё и открывает
  #  ОТДЕЛЬНЫЙ коннект к ноде: 2 несущие + N сессий, при N >= 2 — теневой
  #  бан ТСПУ. При only-tcp: false сессия идёт стримом в несущей и коннектов
  #  не добавляет. Основной объём UDP это не затрагивает — QUIC на 443
  #  разбирается сильно выше в sub-rules.quic, а DNS перехватывается
  #  в sing-tun ещё до движка правил.
  #
  #  РУНЕТ СЮДА НЕ ДОХОДИЛ И НЕ ДОХОДИТ: ru-direct-inline, geosite-ru
  #  и geoip-ru -> «Без VPN» стоят выше и решают любой российский домен
  #  или IP, хоть TCP, хоть UDP.

  # Остаток трафика (пойдет в прокси)
  - MATCH,Основной профиль
# Узлы сюда подставляет само приложение, когда по ссылке подписки пришёл
# не конфиг, а список ссылок протоколов (D-19). Записи ниже — служебные,
# на них ссылаются группы.
proxies:
  - name: "DIRECTv4"
    type: direct
    udp: true
    ip-version: ipv4
