    `hide: [navigation, toc]` on wide screens, because on a phone the navigation sidebar is the ☰ menu. -#}

{% block container %}
  <div id="__skip" tabindex="-1" class="dk-home" data-md-component="content">
    {{ page.content }}
  </div>
{% endblock %}
