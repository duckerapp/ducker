# ducker documentation site, English. The Russian site is mkdocs.ru.yml. Build from this directory:
#   pip install -r requirements.txt
#   python sources.py && zensical build --strict && zensical build --strict -f mkdocs.ru.yml

site_name: DUCKER
site_description: Open-source VPN client for Android and Android TV powered by mihomo
site_url: https://duckerapp.github.io/ducker/
site_dir: build

# Intentionally omit repo_url: the theme would request star and fork counts from
# the GitHub API in the visitor's browser. Like the app, the site sends no data.
# The footer repository link (extra.social) is a plain link without API requests.
copyright: ducker — GPL-3.0. No analytics or trackers.

theme:
  name: material
  custom_dir: overrides
  language: en
  # Use system fonts, as in the app, instead of fetching Google Fonts.
  font: false
  favicon: assets/favicon.png
  icon:
    logo: ducker/duck
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light theme
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight

# A broken link or anchor fails the build with --strict.
validation:
  links:
    anchors: warn

extra_css:
  - assets/ducker.css

# The base64 converter on the ducker-* headers page; works in the browser, sends nothing.
extra_javascript:
  - assets/base64.js

extra:
  # Omit the "Made with Material for MkDocs" footer text.
  generator: false
  # Both languages are published side by side: English at /ducker/, Russian at /ducker/ru/.
  alternate:
    - name: English
      link: /ducker/
      lang: en
    - name: Русский
      link: /ducker/ru/
      lang: ru
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/duckerapp/ducker
      name: Source code on GitHub

plugins:
  # Search uses a prebuilt index in the browser without external requests.
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Keep heading anchors consistent with links in the English FAQ.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Users:
      - Installation: users/install.md
      - Questions and answers: users/faq.md
      - Privacy: users/privacy.md
  - Providers:
      - Subscription for ducker: providers/start.md
      - ducker-* headers: providers/headers.md
      - Devices and limits: providers/devices.md
      - Built-in template: providers/template.md
  - Help the project:
      - Contributing: help/contributing.md
      - Security: help/security.md
  - Community:
      - Community and contact: support/contact.md
      - Roadmap: support/roadmap.md
      - Credits: support/credits.md
