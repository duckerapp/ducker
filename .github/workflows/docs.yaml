name: Documentation and release tools
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: pip install -r site/requirements.txt
      - name: Release tool fixtures (no keys, devices or hosting)
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Shell syntax
        run: bash -n scripts/release.sh scripts/publish.sh scripts/smoke.sh scripts/release-notes.sh
      - name: Build both documentation languages
        working-directory: site
        run: |
          python sources.py
          zensical build --strict
          zensical build --strict -f mkdocs.ru.yml
          python ../scripts/check-site.py build
