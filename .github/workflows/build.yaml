name: Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

# Сборка занимает минуты и на приватном репозитории тратит платную квоту Actions.
# Несколько пушей подряд не должны запускать несколько сборок: живёт последняя.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Подмодули — ядро и наши форки uTLS и sing-mux (D-131, D-132). Версию ядра CMake
      # берёт из самого подмодуля (FACTS.md, F-186).
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # The Go of the release builds (D-330): core/toolchain/go.sh downloads the pinned version,
      # checks its SHA-256 and applies the Android patches next to it. The Gradle build calls the
      # script itself; the steps that call `go` find the same Go first on PATH. The assignment stops
      # the step if the script fails; inside `echo` the runner's own Go would go on silently.
      - name: Setup Go
        run: |
          GOROOT=$(core/toolchain/go.sh env GOROOT)
          echo "$GOROOT/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update CA bundle
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      # Юнит-тесты приложения, среди них чистка журнала (D-46). AGP 9 заводит их только для
      # отладочной сборки: задачи testMetaReleaseUnitTest больше нет, и с 22.09.2026 CI
      # падал здесь, не доходя до сборки (F-139).
      - name: Check log scrubbing
        run: ./gradlew --no-daemon :app:testMetaDebugUnitTest

      # Проверка сессий мультиплекса (D-105) — на настоящем HTTP/2 и настоящем сервере
      # sing-mux, с детектором гонок: она живёт в фоновых горутинах.
      - name: Test mux health checks
        # From the core's module, not the fork's own: there the tests get the dependency versions the
        # core ships with — the HTTP/2 of h2mux among them (D-331) — not the fork's older pins.
        working-directory: core/src/foss/golang
        # -race работает только с cgo, а в окружении раннера CGO_ENABLED=0 (видно в
        # `go env` шага Setup Go). Шаг добавлен 23.09 и до 27.09 ни разу не запускался (F-139).
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=3 github.com/metacubex/sing-mux/...

      # The core wrapper's own tests, with the race detector. `native/app/dns.go` needs Android, so an overlay puts a
      # stub in its place (F-204); the root package `cfa/native` needs the NDK's headers and is left out.
      - name: Test the core wrapper
        working-directory: core/src/foss/golang
        env:
          CGO_ENABLED: "1"
        run: |
          printf 'package app\n\nfunc NotifyDnsChanged(string) {}\n' > "$RUNNER_TEMP/dns_stub.go"
          printf '{"Replace": {"%s": "%s"}}' "$GITHUB_WORKSPACE/core/src/main/golang/native/app/dns.go" \
            "$RUNNER_TEMP/dns_stub.go" > "$RUNNER_TEMP/overlay.json"
          go test -race -count=1 -overlay "$RUNNER_TEMP/overlay.json" -tags foss,with_gvisor,cmfa \
            cfa/native/app cfa/native/config cfa/native/convert cfa/native/delegate cfa/native/panicguard \
            cfa/native/platform cfa/native/proxy cfa/native/tun cfa/native/tunnel

      # Release lint: NewApi for Android 8 (D-482) and the release variant's own checks. No APK is built (D-154).
      - name: Lint the release variant
        run: ./gradlew --no-daemon :app:lintMetaRelease

      # Только ядро, без APK: APK собираются на компьютере разработчика, а их выгрузка
      # упиралась в квоту хранилища артефактов. Задача настраивает CMake (версия ядра), собирает
      # Go-ядро под все четыре ABI и мост к нему; код приложения компилирует шаг юнит-тестов.
      - name: Build core
        run: ./gradlew --no-daemon :core:externalNativeBuildMetaRelease

      # Packaging catches R8 and resource failures that a native-core build cannot catch.
      # No production signing key or uploaded APK is needed for this check.
      - name: Package ARM release APKs
        run: ./gradlew --no-daemon :app:assembleMetaRelease -Pabi=arm64-v8a,armeabi-v7a

      # Проверка D-5: в собранном ядре должна быть наша uTLS, а не та, что тянется
      # транзитом. Молчаливая подмена уже случалась — см. FACTS.md, F-39 и F-44.
      - name: Verify pinned dependencies
        run: |
          set -e
          SO=core/build/outputs/golang/metaRelease/arm64-v8a/libclash.so
          # `go version -m` печатает замену отдельной строкой, начинающейся с "=>",
          # а не дописывает её к строке dep — отсюда такой шаблон.
          # Пин легко перестаёт действовать молча, если замену положить не в тот
          # модуль (FACTS.md, F-39), поэтому проверяем сам бинарь, а не go.mod.
          # uTLS — подмодуль ./utls, наш форк duckerapp/utls (D-132).
          go version -m "$SO" | grep -qE "^[[:space:]]*=>[[:space:]]+\./utls" \
            || { echo "В libclash.so нет подменённого utls"; go version -m "$SO" | grep utls; exit 1; }
          # sing-mux — подмодуль ./sing-mux, наш форк duckerapp/sing-mux (D-105, D-132).
          go version -m "$SO" | grep -qE "^[[:space:]]*=>[[:space:]]+\./sing-mux" \
            || { echo "В libclash.so не наша копия sing-mux"; go version -m "$SO" | grep sing-mux; exit 1; }
          go version -m "$SO" | grep -E 'utls|sing-mux'
