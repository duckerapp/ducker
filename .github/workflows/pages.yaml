name: Site

# Сайт документации: собирается из site/ и выкладывается на GitHub Pages.
#
# Repository open since 25.11.2026 (1.0.0): the site rebuilds itself after each change to its sources in main;
# Actions → Site → Run workflow still works by hand.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "docs/FAQ.md"
      - "docs/FAQ.ru.md"
      - "CONTRIBUTING.md"
      - "docs/CONTRIBUTING.ru.md"
      - "docs/CREDITS.md"
      - "docs/CREDITS.ru.md"
      - "docs/images/en/**"
      - "docs/images/ru/**"
      - "PRIVACY_POLICY.md"
      - "docs/PRIVACY_POLICY.ru.md"
      - "SECURITY.md"
      - "docs/SECURITY.ru.md"
      - ".github/workflows/pages.yaml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install Zensical
        run: pip install -r site/requirements.txt

      # --strict: a broken link or anchor fails the build, and so does a missed replacement in sources.py.
      # English first: its build clears build/, the Russian one writes build/ru/.
      - name: Build
        working-directory: site
        run: |
          python sources.py
          zensical build --strict
          zensical build --strict -f mkdocs.ru.yml

      - name: Upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
