name: Site

# Сайт документации: собирается из site/ и выкладывается на GitHub Pages.
#
# Пока запускается только вручную (Actions → Site → Run workflow): бесплатный GitHub публикует
# Pages только у открытых репозиториев. Включить после открытия:
#   1. Settings → Pages → Source: GitHub Actions.
#   2. Раскомментировать push ниже — сайт будет обновляться сам после каждого слияния в main.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "site/**"
  #     - "docs/FAQ.md"
  #     - "docs/CREDITS.md"
  #     - "docs/images/ru/**"
  #     - "PRIVACY_POLICY.md"
  #     - "CONTRIBUTING.md"
  #     - "SECURITY.md"
  #     - ".github/workflows/pages.yaml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install MkDocs
        run: pip install -r site/requirements.txt

      # --strict: битая ссылка, якорь или промах замены в hooks/sources.py — ошибка сборки.
      - name: Build
        working-directory: site
        run: mkdocs build --strict

      - name: Upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
