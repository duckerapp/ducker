name: "Bug report (English)"
description: "Something does not work as expected"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report!

        **Do not paste** subscription links, config files, keys, server addresses or the device id:
        anyone could use them to access your VPN. Questions about the service itself (payment, speed
        of a particular server) go to your provider.
  - type: textarea
    id: what
    attributes:
      label: "What happened"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "ducker and core version"
      description: "Settings → bottom of the screen."
    validations:
      required: true
  - type: textarea
    id: device
    attributes:
      label: "Device"
      value: |
        - Manufacturer and model:
        - ROM (MIUI, HyperOS, ColorOS, One UI…):
        - Android version:
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: "Log"
      description: |
        Reproduce the problem, then **Settings → Log → Send** and attach the file. Server addresses,
        keys and the device id are removed automatically; visited domain names remain — review the
        file before posting.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: "Check"
      options:
        - label: "I did not paste subscription links, configs, keys or server addresses"
          required: true
